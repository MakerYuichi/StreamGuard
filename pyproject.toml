[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "streamguard"
version = "0.1.0"
requires-python = ">=3.12"
description = "Real-time streaming anomaly detector for network intrusions"
dependencies = [
    # Kafka / Redpanda
    "kafka-python-ng==2.2.3",
    # Database
    "psycopg2-binary==2.9.9",
    # Cache
    "redis==5.0.1",
    # WebSocket server
    "websockets==12.0",
    # Data processing
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    # Hashing
    "mmh3>=4.0,<5.0",
    # Config / env
    "python-dotenv>=1.0,<2.0",
    # Typing (backport, stdlib in 3.11+ but explicit is fine)
    "typing-extensions>=4.9,<5.0",
]

[project.optional-dependencies]
# Extra deps only needed for Stage 2 / model training
ml = [
    "scikit-learn>=1.4,<2.0",
    "networkx>=3.2,<4.0",
    "scipy>=1.12,<2.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
    "psutil>=5.9,<6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["streamguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
