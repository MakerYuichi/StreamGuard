# Docker Compose for CIC-IDS2017 Attribute Analysis
#
# Runs the attribute analysis pipeline in an isolated container.
# Automatically processes CIC-IDS2017 CSVs and generates detection rules.
#
# Usage:
#   # Full pipeline: Load CSVs → analyze → verify
#   make attributes-docker
#
#   # Or manually run stages:
#   docker compose -f docker-compose.analysis.yml run --rm loader
#   docker compose -f docker-compose.analysis.yml run --rm analysis
#   docker compose -f docker-compose.analysis.yml run --rm verify

version: '3.8'

services:

  # ---- Stage 1: Load CIC-IDS2017 CSVs and convert to Parquet ----
  loader:
    build:
      context: .
      dockerfile: Dockerfile.analysis
    container_name: streamguard-loader
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./scripts:/app/scripts:ro
    working_dir: /app
    command: python scripts/load_cicids.py

  # ---- Stage 2: Run Attribute Analysis ----
  analysis:
    build:
      context: .
      dockerfile: Dockerfile.analysis
    container_name: streamguard-analysis
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    working_dir: /app
    command: sh -c "python scripts/attribute_analysis.py --input data/processed/cic-ids2017.parquet --output results/"

  # ---- Stage 3 (Optional): Verify outputs ----
  verify:
    image: python:3.12
    container_name: streamguard-verify
    volumes:
      - ./results:/app/results
    working_dir: /app
    command: sh -c "echo '=== Attribute Analysis Results ===' && ls -lh /app/results/ && echo '' && echo '✓ Done!'"
